name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL --fail -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot/godot

      - name: Import the project
        run: /tmp/godot/godot --headless --import

      - name: Run unit tests (GUT)
        run: /tmp/godot/godot --headless -s addons/gut/gut_cmdln.gd
