name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5
        with:
          # Sprite sheets live in Git LFS; without them Godot imports pointer files and fails.
          lfs: true

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL --fail -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot/godot

      - name: Import the project
        run: /tmp/godot/godot --headless --import

      - name: Run unit tests (GUT)
        run: /tmp/godot/godot --headless -s addons/gut/gut_cmdln.gd

      - name: Smoke test (the bot plays a full run in the real game scenes and saves its progress)
        run: |
          timeout 600 /tmp/godot/godot --headless --fixed-fps 60 --quit-after 200000 -- --autoplay --quit-at-end --save-path=user://smoke_save.json 2>&1 | tee smoke.log
          grep -q "Autoplay run ended" smoke.log
          if grep -E "SCRIPT ERROR|^ERROR" smoke.log; then exit 1; fi
          save_file="$(sed -n 's/^Progress saved to //p' smoke.log)"
          test -n "$save_file"
          cat "$save_file"
          grep -q '"runs_played": 1' "$save_file"

      - name: Simulation benchmark (for information, never fails the build)
        run: /tmp/godot/godot --headless -s tools/benchmark_sim.gd || true
