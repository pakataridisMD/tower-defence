name: Balance

# Plays the campaign and the skirmish with the scripted player and prints how it did. It takes a
# while, so it only runs when asked: by hand, or by a commit on a branch whose message contains
# [compare] (how several kinds of bot do, a minute or two), [tune] (new numbers for
# tools/campaign/tuning.py, the longest run) or [pacing] (how much of the meta tree a player
# has after each campaign stage, see tools/meta_pacing.gd).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

jobs:
  tune:
    if: >-
      github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tune]')
      || contains(github.event.head_commit.message, '[compare]')
      || contains(github.event.head_commit.message, '[pacing]')
    # Runs on the self-hosted Mac mini (no GitHub minutes), one job at a time. Six stages run at once
    # there, which leaves room for the Blender renders the Mac also does.
    runs-on: [self-hosted, macOS, godot]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/godot
        with:
          version: 4.7.2

      - name: Import the project
        run: |
          "$GODOT" --headless --import

      - name: How each kind of bot does
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compare]')
        run: |
          "$GODOT" --headless -s tools/campaign_balance.gd -- --compare 2>&1 | grep -E "COMPARE|ERROR"

      - name: Tune the skirmish waves
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tune]')
        run: |
          "$GODOT" --headless -s tools/campaign_balance.gd -- --skirmish 2>&1 | grep -E "skirmish|SKIRMISH|ERROR"

      - name: Tune the campaign
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tune]')
        # One stage per process, six at a time: the long waves on the big maps make a single pass take
        # well over an hour.
        run: |
          "$GODOT" --headless -s tools/campaign_balance.gd -- --list 2>/dev/null | sed -n 's/^STAGE //p' > stages.txt
          cat stages.txt
          xargs -P6 -I{} sh -c '"$GODOT" --headless -s tools/campaign_balance.gd -- --tune --stage={} 2>&1 | grep -E "TUNING|ERROR"' < stages.txt

      - name: Meta tree pacing across the campaign
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pacing]')
        run: |
          "$GODOT" --headless -s tools/meta_pacing.gd 2>&1 | grep -E "PACING|ERROR"
