name: Screenshots

# Plays the game in a real window and keeps the screenshots, so a branch that changes how the game
# looks can be checked by eye. It never fails the build.
#
# It runs on the self-hosted Mac mini, where the game window opens on the Mac's screen and shares the
# GPU with the Blender renders, so it only runs when asked:
#   gh workflow run screenshots.yml --ref <branch>
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: [self-hosted, macOS, godot]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/godot
        with:
          version: 4.7.2

      - name: Import the project
        run: |
          "$GODOT" --headless --import

      - name: Take the menu and the HUD
        run: |
          mkdir -p shots/ui
          timeout 600 "$GODOT" --rendering-driver opengl3 \
            --resolution 1920x1080 --fixed-fps 30 res://tools/capture.tscn -- --ui --out="$PWD/shots/ui" 2>&1 | tail -n 60 || true
          ls -la shots/ui

      - name: Take the campaign world map
        run: |
          mkdir -p shots/map
          timeout 300 "$GODOT" --rendering-driver opengl3 \
            --resolution 1920x1080 --fixed-fps 30 res://tools/capture.tscn -- --map --out="$PWD/shots/map" 2>&1 | tail -n 20 || true
          ls -la shots/map

      - name: Take the big maps
        run: |
          mkdir -p shots/bigmaps
          timeout 600 "$GODOT" --rendering-driver opengl3 \
            --resolution 1920x1080 --fixed-fps 30 res://tools/capture.tscn -- --bigmaps --out="$PWD/shots/bigmaps" 2>&1 | tail -n 30 || true
          ls -la shots/bigmaps

      - name: Take the weather
        run: |
          mkdir -p shots/weather
          timeout 600 "$GODOT" --rendering-driver opengl3 \
            --resolution 1920x1080 --fixed-fps 30 res://tools/capture.tscn -- --weather --out="$PWD/shots/weather" 2>&1 | tail -n 30 || true
          ls -la shots/weather

      - name: Take a whole run
        run: |
          mkdir -p shots/run
          timeout 900 "$GODOT" --rendering-driver opengl3 \
            --resolution 1920x1080 --fixed-fps 30 res://tools/capture.tscn -- --out="$PWD/shots/run" 2>&1 | tail -n 40 || true
          ls -la shots/run

      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/**/*.png
          if-no-files-found: warn
          retention-days: 14

      # The pictures again, as text in this log, for tools that can read a log but not a build's files.
      - name: Print the screenshots into the log
        run: |
          python3 -m venv "$RUNNER_TEMP/shots-venv" && . "$RUNNER_TEMP/shots-venv/bin/activate" || true
          python3 -m pip install -q pillow || true
          python3 tools/ci/print_shots.py shots/ui --quality=74 || true
          python3 tools/ci/print_shots.py shots/map --quality=74 || true
          python3 tools/ci/print_shots.py shots/bigmaps --width=1280 --quality=70 || true
          python3 tools/ci/print_shots.py shots/run --width=1280 --quality=66 || true
          python3 tools/ci/print_shots.py shots/weather --width=1280 --quality=72 || true
          python3 tools/ci/print_shots.py shots/weather/gust --width=960 --quality=70 || true
