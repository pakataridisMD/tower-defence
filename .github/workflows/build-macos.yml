name: Build macOS app

# Run it from the Actions tab (Build macOS app > Run workflow). The app is in the run's artifacts.
on:
  workflow_dispatch:

jobs:
  macos-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5

      - name: Download Godot ${{ env.GODOT_VERSION }} and the macOS export template
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -sSL --fail -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot/godot
          curl -sSL --fail -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -oqj /tmp/templates.tpz templates/version.txt templates/macos.zip -d "$dest"
          rm /tmp/templates.tpz

      - name: Export the app
        run: tools/build/export_macos.sh /tmp/godot/godot

      - uses: actions/upload-artifact@v4
        with:
          name: tower-defence-2d-macos
          path: builds/macos/Tower Defence 2D.zip
          compression-level: 0
